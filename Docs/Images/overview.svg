<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" font-family="'Segoe UI', Arial, Helvetica, sans-serif">
  <defs>
    <marker id="aDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
    <marker id="aPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
  </defs>

  <rect width="1120" height="450" fill="#f8fafc"/>

  <!-- ============ Sensors ============ -->
  <rect x="20" y="40" width="250" height="140" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="145" y="80" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">GNSS receiver</text>
  <text x="145" y="106" font-size="16" fill="#475569" text-anchor="middle">Quectel LC86G-LA</text>
  <text x="145" y="132" font-size="16" fill="#1e293b" text-anchor="middle">NMEA + PPS</text>

  <rect x="20" y="250" width="250" height="140" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5"/>
  <text x="145" y="290" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">IMU</text>
  <text x="145" y="316" font-size="16" fill="#475569" text-anchor="middle">ICM-20948</text>
  <text x="145" y="342" font-size="16" fill="#1e293b" text-anchor="middle">~102 samples/s · INT1</text>

  <!-- ============ Firmware ============ -->
  <rect x="380" y="20" width="720" height="410" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="405" y="58" font-size="24" font-weight="700" fill="#0f172a">STM32F756ZG firmware</text>
  <text x="405" y="84" font-size="16" fill="#475569">NUCLEO-F756ZG · FreeRTOS · HAL · C</text>

  <g fill="#ffffff" stroke-width="2">
    <rect x="405" y="100" width="222" height="70" rx="10" stroke="#1d4ed8"/>
    <rect x="405" y="195" width="222" height="80" rx="10" stroke="#6d28d9"/>
    <rect x="405" y="300" width="222" height="70" rx="10" stroke="#15803d"/>
    <rect x="690" y="150" width="385" height="100" rx="10" stroke="#ea580c"/>
  </g>
  <g text-anchor="middle">
    <text x="516" y="130" font-size="18" font-weight="700" fill="#1e3a8a">GNSS task</text>
    <text x="516" y="154" font-size="14" fill="#475569">UTC, position, fix validity</text>

    <text x="516" y="227" font-size="18" font-weight="700" fill="#5b21b6">TIM2 · 1 MHz</text>
    <text x="516" y="251" font-size="14" fill="#475569">input capture: one time base</text>
    <text x="516" y="268" font-size="13" fill="#6d28d9">CH1 = PPS · CH2 = INT1</text>

    <text x="516" y="330" font-size="18" font-weight="700" fill="#14532d">IMU task</text>
    <text x="516" y="354" font-size="14" fill="#475569">I²C burst read → |a| in g</text>

    <text x="882" y="184" font-size="20" font-weight="700" fill="#7c2d12">Impact detector</text>
    <text x="882" y="210" font-size="15" fill="#475569">moving baseline · deviation ≥ 0.20 g</text>
    <text x="882" y="234" font-size="15" fill="#475569">+ PPS-referenced UTC and GNSS position</text>
  </g>

  <!-- output -->
  <rect x="690" y="290" width="385" height="115" rx="10" fill="#0f172a" stroke="#0f172a" stroke-width="2"/>
  <text x="708" y="314" font-size="13" fill="#94a3b8">USART3 → ST-LINK Virtual COM Port</text>
  <g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#e2e8f0">
    <text x="708" y="340" fill="#fbbf24" font-weight="700">*** IMPACT CANDIDATE</text>
    <text x="708" y="361">UTC=16:36:32.282751</text>
    <text x="708" y="381">LAT=32.161263 N  LON=34.834736 E</text>
    <text x="708" y="399">ACC=1.30 g  DEVIATION=0.29 g</text>
  </g>

  <!-- ============ Signals into the MCU ============ -->
  <line x1="272" y1="135" x2="401" y2="135" stroke="#1d4ed8" stroke-width="3" marker-end="url(#aBlue)"/>
  <text x="336" y="125" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">NMEA (DMA)</text>

  <path d="M272,165 L330,165 L330,215 L401,215" fill="none" stroke="#6d28d9" stroke-width="3" marker-end="url(#aPurple)"/>
  <text x="338" y="207" font-size="13" font-weight="700" fill="#6d28d9">PPS</text>

  <path d="M272,285 L330,285 L330,255 L401,255" fill="none" stroke="#6d28d9" stroke-width="3" marker-end="url(#aPurple)"/>
  <text x="338" y="275" font-size="13" font-weight="700" fill="#6d28d9">INT1</text>

  <line x1="274" y1="335" x2="401" y2="335" stroke="#15803d" stroke-width="3" marker-start="url(#aGreen)" marker-end="url(#aGreen)"/>
  <text x="336" y="325" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">I²C1</text>

  <!-- ============ Inside the firmware ============ -->
  <line x1="516" y1="277" x2="516" y2="296" stroke="#6d28d9" stroke-width="2" marker-end="url(#aPurple)"/>
  <text x="526" y="292" font-size="13" fill="#6d28d9">notify + timestamp</text>

  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#aDark)">
    <path d="M629,135 L655,135 L655,180 L686,180"/>
    <path d="M629,335 L655,335 L655,220 L686,220"/>
    <line x1="882" y1="252" x2="882" y2="286"/>
  </g>
  <text x="662" y="160" font-size="13" fill="#334155">fix</text>
  <text x="662" y="274" font-size="13" fill="#334155">samples</text>
</svg>
